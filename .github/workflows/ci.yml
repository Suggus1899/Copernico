name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los tests levantan MongoDB en memoria (replica set) y descargan el binario en la primera ejecución.
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run test:compiled

  api-image:
    name: API (imagen de producción)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --tag copernico-api:ci .
      - name: Importar la API compilada sin dependencias de desarrollo
        run: >-
          docker run --rm -e NODE_ENV=test --entrypoint node copernico-api:ci
          -e "import('./dist/src/app.js').then(() => console.log('API compilada disponible'))"

  client:
    name: Cliente (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
